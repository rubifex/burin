name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - run: bundle exec rake
        env:
          SPIRV_TOOLS_REQUIRED: ${{ runner.os == 'Linux' && '1' || '0' }}
      - run: gem build electra.gemspec
      - if: runner.os == 'Linux' && matrix.ruby == '4.0'
        run: BUDGET=1 bundle exec rake bench
